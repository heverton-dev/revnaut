services:
  site:
    build:
      context: .
      args:
        NOINDEX: ${NOINDEX:-yes}
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.site-redesign.entrypoints=websecure"
      - "traefik.http.routers.site-redesign.rule=Host(`${SITE_HOST}`)"
      - "traefik.http.routers.site-redesign.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.routers.site-redesign-http.entrypoints=web"
      - "traefik.http.routers.site-redesign-http.rule=Host(`${SITE_HOST}`)"
      - "traefik.http.routers.site-redesign-http.middlewares=site-redesign-https"
      - "traefik.http.middlewares.site-redesign-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.site-redesign-https.redirectscheme.permanent=true"
      - "traefik.http.services.site-redesign.loadbalancer.server.port=${CONTAINER_PORT}"

networks:
  proxy:
    name: ${TRAEFIK_NETWORK}
    external: true
