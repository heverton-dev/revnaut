version: "3.8"

services:
  app:
    image: rvops_app:latest
    environment:
      - PORT=8000
    networks:
      - network_conexao
    volumes:
      - /opt/rvops/data:/app/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_conexao"
        
        # Router HTTPS (websecure) - suporta revnaut e rvops
        - "traefik.http.routers.revnaut.entrypoints=websecure"
        - "traefik.http.routers.revnaut.rule=Host(`revnaut.vpsconexao.org`) || Host(`rvops.vpsconexao.org`)"
        - "traefik.http.routers.revnaut.service=revnaut"
        - "traefik.http.routers.revnaut.tls.certresolver=letsencryptresolver"
        
        # Router HTTP com Redirecionamento permanente para HTTPS
        - "traefik.http.routers.revnaut-http.entrypoints=web"
        - "traefik.http.routers.revnaut-http.rule=Host(`revnaut.vpsconexao.org`) || Host(`rvops.vpsconexao.org`)"
        - "traefik.http.routers.revnaut-http.middlewares=revnaut-redirect-https"
        - "traefik.http.middlewares.revnaut-redirect-https.redirectscheme.scheme=https"
        - "traefik.http.middlewares.revnaut-redirect-https.redirectscheme.permanent=true"
        
        # Serviço backend
        - "traefik.http.services.revnaut.loadbalancer.server.port=8000"
        - "traefik.http.services.revnaut.loadbalancer.passHostHeader=true"

        # Rate Limiting & Security Headers Middleware
        - "traefik.http.routers.revnaut.middlewares=revnaut-ratelimit,revnaut-security-headers"
        - "traefik.http.middlewares.revnaut-ratelimit.ratelimit.average=100"
        - "traefik.http.middlewares.revnaut-ratelimit.ratelimit.burst=50"
        - "traefik.http.middlewares.revnaut-security-headers.headers.sslredirect=true"
        - "traefik.http.middlewares.revnaut-security-headers.headers.stsSeconds=315360000"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    networks:
      - network_conexao
    volumes:
      - /opt/rvops/redis:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  worker:
    image: rvops_app:latest
    command: python -m src.workers.runner
    environment:
      - REDIS_URL=redis://redis:6379/0
    networks:
      - network_conexao
    volumes:
      - /opt/rvops/data:/app/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=revnaut
      - POSTGRES_USER=revnaut_admin
      - POSTGRES_PASSWORD_FILE=/run/secrets/pg_password
    networks:
      - network_conexao
    volumes:
      - /opt/rvops/postgres:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  listmonk-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=listmonk
      - POSTGRES_USER=listmonk
      - POSTGRES_PASSWORD_FILE=/run/secrets/listmonk_db_password
    networks:
      - network_conexao
    volumes:
      - /opt/rvops/listmonk_db:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  listmonk:
    image: listmonk/listmonk:v3.0.0
    command: [sh, -c, "sleep 5 && ./listmonk --config='' --install --idempotent --yes && ./listmonk --config=''"]
    environment:
      - LISTMONK_db__host=listmonk-db
      - LISTMONK_db__port=5432
      - LISTMONK_db__user=listmonk
      - LISTMONK_db__database=listmonk
      - LISTMONK_app__address=0.0.0.0:9000
    networks:
      - network_conexao
    volumes:
      - /opt/rvops/listmonk_data:/listmonk/data
    depends_on:
      - listmonk-db
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    environment:
      - LIVEKIT_CONFIG_FILE=/etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - network_conexao
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  documenso:
    image: documenso/documenso:latest
    environment:
      - NEXTAUTH_URL=http://documenso.revnaut.internal:3000
      - NEXTAUTH_SECRET=${DOCUMENSO_SECRET:-supersecret_documenso_key}
      - DATABASE_URL=postgresql://revnaut_user:revnaut_secret_pg_2026@postgres:5432/revnaut_crm
      - NEXT_PUBLIC_WEBAPP_URL=http://documenso.revnaut.internal:3000
    ports:
      - "3000:3000"
    networks:
      - network_conexao
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  calcom:
    image: calcom/cal.com:latest
    environment:
      - DATABASE_URL=postgresql://revnaut_user:revnaut_secret_pg_2026@postgres:5432/calcom
      - NEXTAUTH_SECRET=${CALCOM_SECRET:-secret_calcom_jwt_key_2026}
      - CALENDSO_ENCRYPTION_KEY=${CALCOM_ENCRYPTION_KEY:-secret_calcom_encryption_32chars}
      - NEXT_PUBLIC_WEBAPP_URL=http://calcom.revnaut.internal:3000
    ports:
      - "3002:3000"
    networks:
      - network_conexao
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  superset:
    image: apache/superset:3.1.0
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-revnaut_superset_secret_jwt_key_2026}
      - DATABASE_DB=revnaut_crm
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=revnaut_user
      - DATABASE_PASSWORD=revnaut_secret_pg_2026
      - GUEST_ROLE_NAME=Gamma
      - SUPERSET_FEATURE_EMBEDDED_SUPERSET=true
    ports:
      - "8088:8088"
    networks:
      - network_conexao
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  windmill:
    image: ghcr.io/windmill-labs/windmill:latest
    environment:
      - DATABASE_URL=postgresql://revnaut_user:revnaut_secret_pg_2026@postgres:5432/revnaut_crm
      - RUST_LOG=info
      - BASE_URL=http://windmill.revnaut.internal:8000
    ports:
      - "8001:8000"
    networks:
      - network_conexao
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  orthanc:
    image: orthancteam/orthanc:24.3.0
    environment:
      - ORTHANC_JSON={"Name":"Revnaut-Orthanc-DICOM","StorageDirectory":"/var/lib/orthanc/db","StorageAreaPlugin":"s3","S3":{"BucketName":"revnaut-dicom-studies","Region":"auto","Endpoint":"${R2_ENDPOINT:-https://r2.revnaut.internal}","AccessKey":"${R2_ACCESS_KEY_ID:-mock-key}","SecretKey":"${R2_SECRET_ACCESS_KEY:-mock-secret}"},"DicomAet":"REVNAULT_PACS","DicomCheckCalledAet":false,"DicomPort":4242,"HttpPort":8042,"RemoteAccessAllowed":true,"AuthenticationEnabled":false}
    ports:
      - "8042:8042"
      - "4242:4242"
    networks:
      - network_conexao
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  network_conexao:
    external: true



