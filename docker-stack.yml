version: "3.8"

networks:
  network_conexao:
    external: true
  revnault_edge:
    driver: overlay
    attachable: true
    ipam:
      config:
        - subnet: 10.0.20.0/24
  revnault_app:
    driver: overlay
    attachable: true
    ipam:
      config:
        - subnet: 10.0.21.0/24
  revnault_data:
    driver: overlay
    internal: true
    ipam:
      config:
        - subnet: 10.0.22.0/24

volumes:
  sqlite_data:
  postgres_data:
  postgres_replica_data:
  redis_data:
  evolution_data:
  chatwoot_data:
  mautic_data:
  listmonk_data:
  orthanc_data:
  traefik_certificates:

services:

  frontend:
    image: revnault_frontend:latest
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=https://revnault.vpsconexao.org/api/v1
    networks:
      - network_conexao
      - revnault_edge
      - revnault_app
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
      restart_policy:
        condition: on-failure

  app:
    image: revnault_app:latest
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://revnault_admin:${PG_PASSWORD:-revnault_pg_pass}@postgres:5432/revnault
      - READ_DATABASE_URL=postgresql+asyncpg://revnault_admin:${PG_PASSWORD:-revnault_pg_pass}@postgres-replica:5432/revnault
      - REVNAULT_ENV=production
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      - VAULT_SECRET_KEY=${VAULT_SECRET_KEY}
      - OMNICHANNEL_WEBHOOK_SECRET=${OMNICHANNEL_WEBHOOK_SECRET}
      - DOCUMENSO_WEBHOOK_SECRET=${DOCUMENSO_WEBHOOK_SECRET}
      - CALCOM_WEBHOOK_SECRET=${CALCOM_WEBHOOK_SECRET}
      - LISTMONK_WEBHOOK_SECRET=${LISTMONK_WEBHOOK_SECRET}
    networks:
      - network_conexao
      - revnault_edge
      - revnault_app
      - revnault_data
    volumes:
      - /opt/revnault/data:/app/data
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_conexao"
        - "traefik.http.routers.revnault.entrypoints=websecure"
        - "traefik.http.routers.revnault.rule=Host(`revnault.vpsconexao.org`)"
        - "traefik.http.routers.revnault.service=revnault"
        - "traefik.http.routers.revnault.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.revnault-http.entrypoints=web"
        - "traefik.http.routers.revnault-http.rule=Host(`revnault.vpsconexao.org`)"
        - "traefik.http.routers.revnault-http.middlewares=revnault-redirect-https"
        - "traefik.http.middlewares.revnault-redirect-https.redirectscheme.scheme=https"
        - "traefik.http.middlewares.revnault-redirect-https.redirectscheme.permanent=true"
        - "traefik.http.services.revnault.loadbalancer.server.port=8000"
        - "traefik.http.services.revnault.loadbalancer.passHostHeader=true"
        - "traefik.http.routers.revnault.middlewares=revnault-ratelimit,revnault-security-headers"
        - "traefik.http.middlewares.revnault-ratelimit.ratelimit.average=100"
        - "traefik.http.middlewares.revnault-ratelimit.ratelimit.burst=50"
        - "traefik.http.middlewares.revnault-security-headers.headers.sslredirect=true"
        - "traefik.http.middlewares.revnault-security-headers.headers.stsSeconds=315360000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    image: revnault_app:latest
    command: python -m src.workers.runner
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://revnault_admin:${PG_PASSWORD:-revnault_pg_pass}@postgres:5432/revnault
      - REVNAULT_ENV=production
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      - VAULT_SECRET_KEY=${VAULT_SECRET_KEY}
      - OMNICHANNEL_WEBHOOK_SECRET=${OMNICHANNEL_WEBHOOK_SECRET}
      - DOCUMENSO_WEBHOOK_SECRET=${DOCUMENSO_WEBHOOK_SECRET}
      - CALCOM_WEBHOOK_SECRET=${CALCOM_WEBHOOK_SECRET}
      - LISTMONK_WEBHOOK_SECRET=${LISTMONK_WEBHOOK_SECRET}
    networks:
      - revnault_app
      - revnault_data
    volumes:
      - /opt/revnault/data:/app/data
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
      restart_policy:
        condition: on-failure

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=revnault
      - POSTGRES_USER=revnault_admin
      - POSTGRES_PASSWORD=${PG_PASSWORD:-revnault_pg_pass}
    networks:
      - revnault_data
    volumes:
      - /opt/revnault/postgres:/var/lib/postgresql/data
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revnault_admin -d revnault"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=revnault
      - POSTGRES_USER=revnault_admin
      - POSTGRES_PASSWORD=${PG_PASSWORD:-revnault_pg_pass}
    networks:
      - revnault_data
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revnault_admin -d revnault"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    networks:
      - revnault_data
    volumes:
      - /opt/revnault/redis:/data
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  evolution-api:
    image: atendai/evolution-api:v2.1.1
    environment:
      - SERVER_URL=http://evolution-api:8080
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://revnault_admin:${PG_PASSWORD:-revnault_pg_pass}@postgres:5432/revnault
    networks:
      - revnault_edge
      - revnault_app
      - revnault_data
    volumes:
      - evolution_data:/evolution/instances
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
      restart_policy:
        condition: on-failure

  chatwoot:
    image: chatwoot/chatwoot:v3.14.0
    environment:
      - RAILS_ENV=production
      - REDIS_URL=redis://redis:6379/2
      - POSTGRES_HOST=postgres
      - POSTGRES_USERNAME=revnault_admin
      - POSTGRES_PASSWORD=${PG_PASSWORD:-revnault_pg_pass}
      - POSTGRES_DATABASE=revnault
    networks:
      - revnault_edge
      - revnault_app
      - revnault_data
    volumes:
      - chatwoot_data:/app/storage
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
      restart_policy:
        condition: on-failure

  mautic:
    image: mautic/mautic:5-apache
    environment:
      - MAUTIC_DB_HOST=postgres
      - MAUTIC_DB_USER=revnault_admin
      - MAUTIC_DB_PASSWORD=${PG_PASSWORD:-revnault_pg_pass}
      - MAUTIC_DB_NAME=revnault
    networks:
      - revnault_app
      - revnault_data
    volumes:
      - mautic_data:/var/www/html
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
      restart_policy:
        condition: on-failure

  listmonk-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=listmonk
      - POSTGRES_USER=listmonk
      - POSTGRES_PASSWORD=${LISTMONK_PG_PASSWORD:-listmonk_pass}
    networks:
      - revnault_data
    volumes:
      - /opt/revnault/listmonk_db:/var/lib/postgresql/data
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure

  listmonk:
    image: listmonk/listmonk:v3.0.0
    command: [sh, -c, "sleep 5 && ./listmonk --config='' --install --idempotent --yes && ./listmonk --config=''"]
    environment:
      - LISTMONK_db__host=listmonk-db
      - LISTMONK_db__port=5432
      - LISTMONK_db__user=listmonk
      - LISTMONK_db__password=${LISTMONK_PG_PASSWORD:-listmonk_pass}
      - LISTMONK_db__database=listmonk
      - LISTMONK_app__address=0.0.0.0:9000
    networks:
      - revnault_app
      - revnault_data
    volumes:
      - /opt/revnault/listmonk_data:/listmonk/data
    depends_on:
      - listmonk-db
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    environment:
      - LIVEKIT_CONFIG_FILE=/etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - revnault_edge
      - revnault_app
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
      restart_policy:
        condition: on-failure

  documenso:
    image: documenso/documenso:latest
    environment:
      - NEXTAUTH_URL=http://documenso.revnault.internal:3000
      - DATABASE_URL=postgresql://revnault_admin:${PG_PASSWORD:-revnault_pg_pass}@postgres:5432/revnault
      - NEXT_PUBLIC_WEBAPP_URL=http://documenso.revnault.internal:3000
    networks:
      - revnault_app
      - revnault_data
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
      restart_policy:
        condition: on-failure

  calcom:
    image: calcom/cal.com:latest
    environment:
      - DATABASE_URL=postgresql://revnault_admin:${PG_PASSWORD:-revnault_pg_pass}@postgres:5432/revnault
      - NEXT_PUBLIC_WEBAPP_URL=http://calcom.revnault.internal:3000
    networks:
      - revnault_app
      - revnault_data
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
      restart_policy:
        condition: on-failure

  superset:
    image: apache/superset:3.1.0
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-revnault_superset_secret_key_default}
      - DATABASE_DB=revnault
      - DATABASE_HOST=postgres-replica
      - DATABASE_PORT=5432
      - DATABASE_USER=revnault_admin
      - DATABASE_PASSWORD=${PG_PASSWORD:-revnault_pg_pass}
      - GUEST_ROLE_NAME=Gamma
      - SUPERSET_FEATURE_EMBEDDED_SUPERSET=true
    networks:
      - revnault_app
      - revnault_data
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
      restart_policy:
        condition: on-failure

  windmill:
    image: ghcr.io/windmill-labs/windmill:latest
    environment:
      - DATABASE_URL=postgresql://revnault_admin:${PG_PASSWORD:-revnault_pg_pass}@postgres:5432/revnault
      - RUST_LOG=info
      - BASE_URL=http://windmill.revnault.internal:8000
    networks:
      - revnault_app
      - revnault_data
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
      restart_policy:
        condition: on-failure

  orthanc:
    image: orthancteam/orthanc:24.3.0
    environment:
      - ORTHANC_JSON={"Name":"RevNault-Orthanc-DICOM","StorageDirectory":"/var/lib/orthanc/db","StorageAreaPlugin":"s3","DicomAet":"REVNAULT_PACS","DicomPort":4242,"HttpPort":8042,"RemoteAccessAllowed":true}
    networks:
      - revnault_app
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
      restart_policy:
        condition: on-failure

  wal-backup:
    image: revnault_app:latest
    command: python scripts/wal_backup_s3.py --db /app/data/revnault.db --retention 30
    environment:
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-revnaut-wal-backups}
    volumes:
      - /opt/revnault/data:/app/data
    networks:
      - revnault_data
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      restart_policy:
        condition: on-failure
