<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Revnaut Core Ascent Gradient: Electric Ember to Solar Gold to Cyan Star -->
    <linearGradient id="revGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E00" />
      <stop offset="55%" stop-color="#FFA800" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Supersonic Navigation Shard Gradient -->
    <linearGradient id="vectorGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#00FFF0" />
    </linearGradient>

    <!-- Outer Ambient Glow Filter -->
    <filter id="revGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Container Badge -->
  <rect width="64" height="64" rx="16" fill="#07090E" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255, 94, 0, 0.25)" stroke-width="1" />

  <!-- Ambient Internal Energy Nebula -->
  <circle cx="38" cy="22" r="16" fill="#FF5E00" opacity="0.18" filter="url(#revGlow)" />
  <circle cx="44" cy="46" r="12" fill="#00E5FF" opacity="0.16" filter="url(#revGlow)" />

  <!-- Revnaut Monogram R (Precision Geometric Vector) -->
  <g filter="url(#revGlow)">
    <!-- Base R-Letterform -->
    <path d="M16 13 C16 11.895 16.895 11 18 11 L35 11 C43.284 11 49 16.268 49 24.5 C49 31.2 44.8 36.3 38.6 37.8 L48.8 49.6 C49.5 50.4 48.9 51.5 47.9 51.5 L39.5 51.5 C38.8 51.5 38.1 51.1 37.7 50.5 L28.8 40 L25.5 40 L25.5 49.5 C25.5 50.6 24.6 51.5 23.5 51.5 L18 51.5 C16.895 51.5 16 50.6 16 49.5 Z M25.5 19 L25.5 32 L34.5 32 C38.6 32 41.5 29.3 41.5 25.5 C41.5 21.7 38.6 19 34.5 19 Z" fill="url(#revGrad)" />

    <!-- Aerodynamic Forward Vector Blade (Delta Stabilizer) -->
    <path d="M30 30 L47 48.5 L47 38 L36 26 Z" fill="url(#vectorGrad)" opacity="0.9" />

    <!-- Waypoint Orbital Beacon -->
    <circle cx="48" cy="13" r="3.5" fill="#00E5FF" />
    <circle cx="48" cy="13" r="1.5" fill="#FFFFFF" />
  </g>
</svg>
